<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Treinspel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <h1 id="title">Treinspel</h1>
      <div class="top-actions">
        <span id="star-count" class="star-count">★ 0</span>
        <select id="level-select" aria-label="Puzzel"></select>
        <button type="button" id="btn-lang" class="btn small">English</button>
        <button type="button" id="btn-sound" class="btn small" aria-pressed="true">🔊</button>
        <button type="button" id="btn-settings" class="btn small" aria-label="Instellingen">⚙</button>
      </div>
    </header>

    <!-- Track puzzle (top-down) -->
    <main id="screen-build" class="screen">
      <section id="stage" class="stage">
        <div class="board">
          <canvas id="game"></canvas>
          <div id="labels" class="overlay-layer" aria-hidden="true"></div>
        </div>
      </section>

      <aside class="panel">
        <div class="card task">
          <p id="task-text"></p>
          <ul id="station-list"></ul>
        </div>
        <div class="card">
          <h2 id="pieces-heading">Rails</h2>
          <div id="inventory"></div>
          <ul id="help"></ul>
        </div>
        <div class="card actions">
          <button type="button" id="btn-drive-panel" class="btn primary" hidden></button>
          <button type="button" id="btn-reset" class="btn">Opnieuw</button>
        </div>
      </aside>
    </main>

    <!-- Driving (side view) -->
    <main id="screen-drive" class="screen" hidden>
      <section id="drive-stage" class="stage">
        <div id="drive-board" class="board">
          <canvas id="side"></canvas>
          <div id="signs" class="overlay-layer" aria-hidden="true"></div>
          <div class="hud hud-center">
            <div id="orders" class="orders"></div>
            <div id="maths" class="maths" hidden></div>
          </div>
          <div id="messages" class="hud messages" role="status" hidden></div>
          <canvas id="minimap" class="hud"></canvas>
        </div>
      </section>

      <aside class="panel">
        <div class="card task">
          <p id="drive-status"></p>
        </div>
        <div class="card">
          <h2 id="whereto-heading"></h2>
          <div id="destinations"></div>
        </div>
        <div class="card actions">
          <button type="button" id="btn-map" class="btn"></button>
          <button type="button" id="btn-next-drive" class="btn"></button>
        </div>
      </aside>

      <div id="round-done" class="overlay" hidden>
        <div class="dialog" role="dialog" aria-labelledby="round-title">
          <h2 id="round-title"></h2>
          <div id="round-stars" class="stars"></div>
          <div id="round-text"></div>
          <div class="dialog-buttons">
            <button type="button" id="btn-round-map" class="btn"></button>
            <button type="button" id="btn-round-next" class="btn"></button>
            <button type="button" id="btn-new-round" class="btn primary"></button>
          </div>
        </div>
      </div>
    </main>

    <div id="settings" class="overlay" hidden>
      <form class="dialog settings" id="settings-form" role="dialog" aria-labelledby="settings-title">
        <h2 id="settings-title"></h2>
        <p id="settings-intro" class="hint"></p>
        <fieldset>
          <legend id="max-legend"></legend>
          <div id="max-options" class="choice-row"></div>
        </fieldset>
        <fieldset>
          <legend id="skills-legend"></legend>
          <div id="skill-options" class="choice-col"></div>
        </fieldset>
        <fieldset>
          <legend id="difficulty-legend"></legend>
          <div id="difficulty-options" class="choice-col"></div>
        </fieldset>
        <fieldset>
          <legend id="style-legend"></legend>
          <div id="style-options" class="choice-row"></div>
        </fieldset>
        <fieldset>
          <legend id="progress-legend"></legend>
          <div id="progress-table" class="progress-table"></div>
          <p id="progress-totals" class="hint"></p>
          <button type="button" id="btn-reset-progress" class="btn small"></button>
        </fieldset>
        <div class="dialog-buttons">
          <button type="button" id="btn-settings-cancel" class="btn"></button>
          <button type="submit" id="btn-settings-save" class="btn primary"></button>
        </div>
      </form>
    </div>

    <div id="done" class="overlay" hidden>
      <div class="dialog" role="dialog" aria-labelledby="done-title">
        <h2 id="done-title"></h2>
        <div id="done-stars" class="stars"></div>
        <p id="done-text"></p>
        <div class="dialog-buttons">
          <button type="button" id="btn-again" class="btn"></button>
          <button type="button" id="btn-next" class="btn"></button>
          <button type="button" id="btn-drive" class="btn primary"></button>
        </div>
      </div>
    </div>
    <div id="unlock" class="overlay unlock" hidden>
      <div class="dialog" role="dialog" aria-labelledby="unlock-title">
        <div class="unlock-burst">★</div>
        <h2 id="unlock-title"></h2>
        <p id="unlock-text"></p>
        <div class="dialog-buttons">
          <button type="button" id="btn-unlock-later" class="btn"></button>
          <button type="button" id="btn-unlock-play" class="btn primary"></button>
        </div>
      </div>
    </div>

  </div>

  <!-- Classic scripts (no modules) so the game also runs by opening this file directly. -->
  <script src="js/core/util.js"></script>
  <script src="js/core/track.js"></script>
  <script src="js/core/level.js"></script>
  <script src="js/core/network.js"></script>
  <script src="js/core/route.js"></script>
  <script src="js/core/round.js"></script>
  <script src="js/core/settings.js"></script>
  <script src="js/core/progress.js"></script>
  <script src="js/core/maths.js"></script>
  <script src="js/core/generator.js"></script>
  <script src="js/data/themes.js"></script>
  <script src="js/data/goods.js"></script>
  <script src="js/data/i18n.js"></script>
  <script src="js/data/levels.js"></script>
  <script src="js/audio/sound.js"></script>
  <script src="js/gfx/sprites.js"></script>
  <script src="js/gfx/renderer.js"></script>
  <script src="js/gfx/side-sprites.js"></script>
  <script src="js/gfx/side-renderer.js"></script>
  <script src="js/gfx/minimap.js"></script>
  <script src="js/ui/build-screen.js"></script>
  <script src="js/ui/drive-screen.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
